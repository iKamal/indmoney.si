<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="indmoney.si is a premium domain available for acquisition." />
    <meta name="theme-color" content="#f7f7f5" />
    <title>indmoney.si — Available for acquisition</title>
    <style>
      :root { --ink: #121212; --soft: #6d6d69; --line: #ddddda; --paper: #f7f7f5; }
      * { box-sizing: border-box; }
      body {
        display: grid; min-width: 320px; min-height: 100svh; margin: 0;
        color: var(--ink); background: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { display: grid; align-content: center; width: min(760px, calc(100% - 48px)); margin: auto; padding: 56px 0; }
      .domain { margin: 0 0 68px; font-size: 1rem; font-weight: 700; letter-spacing: -.04em; }
      .label { margin: 0 0 18px; color: var(--soft); font-size: .72rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 0; font-size: clamp(3.2rem, 9vw, 6.9rem); font-weight: 650; line-height: .95; letter-spacing: -.075em; }
      .intro { max-width: 530px; margin: 28px 0 0; color: var(--soft); font-size: 1.08rem; line-height: 1.62; }
      .offer {
        display: inline-flex; align-items: center; justify-content: center; width: fit-content; min-height: 52px; margin-top: 38px; padding: 0 22px;
        color: white; background: var(--ink); border-radius: 5px; font-size: .96rem; font-weight: 700; text-decoration: none;
        transition: opacity .18s ease, transform .18s ease;
      }
      .offer:hover { opacity: .82; transform: translateY(-1px); }
      footer { margin-top: 68px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--soft); font-size: .8rem; }
      @media (max-width: 520px) { main { width: min(100% - 36px, 760px); } .domain { margin-bottom: 52px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="domain">indmoney.si</p>
      <p class="label">Premium domain name</p>
      <h1>This premium domain is available for acquisition.</h1>
      <p class="intro"><strong>indmoney</strong> is a clear, memorable name for an investment platform, financial product, or modern wealth brand. Short, direct, and built for a digital-first future.</p>
      <a class="offer" href="mailto:kamal.kumar038@gmail.com?subject=Offer%20for%20indmoney.si&amp;body=Hi%2C%0A%0AI%27d%20like%20to%20make%20an%20offer%20for%20indmoney.si.%0A%0AMy%20offer%3A%20%0A%0AMy%20name%3A%20%0A%0AThank%20you.">Make an offer&nbsp; →</a>
      <footer>Serious enquiries welcome.</footer>
    </main>
  </body>
</html>
